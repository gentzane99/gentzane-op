<section class="gamesPage page-shell">
    <header class="gamesHeader page-hero">
        <h1 class="gamesTitle page-title">JUEGOS</h1>
        <p class="gamesInfo page-subtitle">Una selección de proyectos de videojuegos desarrollados durante mi formación en DigiPen Bilbao.</p>
    </header> 
    @if(loading){
        <div class="state">Cargando juegos...</div>
    } @else if (error){
        <div class="state error">{{error}}</div>
    } @else if(!loading){
        <div class="gamesContainer">
            @for (game of games; track game.id) {
                <app-game-card [game]="game" ></app-game-card>
            }
        </div>
    }
</section>
