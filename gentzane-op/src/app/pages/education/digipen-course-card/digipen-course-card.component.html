<button class="digipenCourseTitle" type="button" (click)="toggleDescription()" [attr.aria-expanded]="isOpen()" [attr.title]="course().code + ' - ' + course().title">
  <span class="titleText">{{course().code}} - {{course().title}}</span>
</button>
@if (isOpen()) {
  <span class="digipenCourseInfo">{{course().description}}</span>
}
